[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aibrowsertoolkit"
version = "0.1.0"
description = "Browser API for AI agents, over HTTP"
requires-python = ">=3.11"
dependencies = [
    # Playwright is the default engine. Selenium is still required rather
    # than optional because `engine.py` derives the neutral exception names
    # from Selenium's classes at import time -- making it opt-in means
    # defining those natively first. See docs/TODO.md.
    "playwright>=1.50",
    "selenium>=4.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
abt = "abt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/abt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
