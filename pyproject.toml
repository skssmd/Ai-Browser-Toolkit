[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-browser-toolkit"
version = "0.3.3"
# One line, and it is what PyPI search results show. It has to answer "for
# whom" as well as "what": a browser-automation library is a crowded shelf, and
# the thing that makes this one different is that a coding agent drives it,
# through whichever of the three interfaces that agent already speaks.
description = "Drive a real Chrome/Edge from your coding agent - CLI, MCP and HTTP. For Claude Code, Codex, Cursor, OpenCode."
keywords = [
    "mcp",
    "model-context-protocol",
    "browser-automation",
    "ai-agent",
    "agentic",
    "claude-code",
    "codex",
    "opencode",
    "cursor",
    "playwright",
    "selenium",
    "chrome",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Utilities",
]

# PyPI renders this as the whole project page. Without it the page is a blank
# stub carrying only the one-line description above -- which is what every
# `pip install ai-browser-toolkit` sends people to look at.
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # Playwright is the default engine. Selenium is still required rather
    # than optional because `engine.py` derives the neutral exception names
    # from Selenium's classes at import time -- making it opt-in means
    # defining those natively first. See docs/TODO.md.
    "playwright>=1.50",
    "selenium>=4.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
]

# The PyPI sidebar. Without these the page offers no way back to the source,
# and a reader who wants to know what a playbook actually contains before
# trusting one has nowhere to go.
[project.urls]
Homepage = "https://github.com/skssmd/Ai-Browser-Toolkit"
Repository = "https://github.com/skssmd/Ai-Browser-Toolkit"
Issues = "https://github.com/skssmd/Ai-Browser-Toolkit/issues"
Playbooks = "https://github.com/skssmd/ABT-Playbooks"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
abt = "abt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/abt"]
# onehr names a real organisation, its routes and its staff records. It is
# gitignored, but a build reads the working tree rather than git -- so without
# this, anyone building from a checkout that still has those files would ship
# them to PyPI. A test asserts they are absent from the built wheel.
exclude = ["**/onehr/**", "**/*onehr*"]

[tool.hatch.build.targets.wheel.force-include]
# Shipped inside the package so every channel carries them, and so the server
# can serve one to an agent that is already talking to it.
"guidelines" = "abt/guidelines"

[tool.pytest.ini_options]
testpaths = ["tests"]
