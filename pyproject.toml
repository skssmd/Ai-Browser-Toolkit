[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aibrowsertoolkit"
version = "0.1.0"
description = "Selenium-backed HTTP browser API for AI agents"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The Playwright engine is opt-in (--engine playwright). Selenium remains
# the default, so a plain install stays free of the Node driver bundle.
playwright = ["playwright>=1.50"]

[project.scripts]
abt = "abt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/abt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
