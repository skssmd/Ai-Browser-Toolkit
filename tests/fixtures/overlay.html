<title>Overlay</title>
<body>
  <a href="#reached" id="link" onclick="document.getElementById('out').textContent = 'link'">
    Real link
  </a>
  <button id="disabled-btn" type="button" disabled
    onclick="document.getElementById('out').textContent = 'disabled ran'">Nope</button>
  <p id="out"></p>

  <!-- The custom-control pattern: the real input is visually hidden and a styled
       element is shown in its place, so the input itself is never "clickable". -->
  <label id="fancy-label" for="fancy">Fancy option</label>
  <input type="radio" id="fancy" name="choice" style="opacity: 0; width: 0; height: 0;"
    onclick="document.getElementById('out').textContent = 'fancy'">

  <!-- The ad-network click-hijack pattern: a transparent full-page layer at max
       z-index that swallows the first click anywhere on the document. -->
  <div id="hijack" style="position: absolute; top: 0; left: 0; width: 100%;
       height: 100%; z-index: 2147483647; pointer-events: auto;"
       onclick="document.getElementById('out').textContent = 'hijacked'"></div>
</body>

<!-- The real shape from a live admin app: clicking an action opens a modal,
     and the action button is then behind that modal's overlay. Refusing the
     second click is correct; the class list on the overlay is a Tailwind
     animation salad, so the error has to name the dialog instead. -->
<button id="approve">Approve</button>
<div id="modal" role="dialog" aria-modal="true"
     style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4)">
  <h2>Confirm approval</h2>
  <button id="modal-cancel">Cancel</button>
</div>
<script>
  document.getElementById('approve').addEventListener('click', function () {
    document.getElementById('modal').style.display = 'block';
  });
  document.getElementById('modal-cancel').addEventListener('click', function () {
    document.getElementById('modal').style.display = 'none';
  });
</script>
