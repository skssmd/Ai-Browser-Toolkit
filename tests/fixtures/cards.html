<title>Cards</title>
<body>
  <h1>Catalogue</h1>
  <div class="card" id="p1" data-price="4.99">
    <h2>Cheap Widget</h2>
    <span class="price">$4.99</span>
  </div>
  <div class="card" id="p2" data-price="19.99">
    <h2>Nice Widget</h2>
    <span class="price">$19.99</span>
  </div>
  <div class="card hidden" id="p3" style="display: none">
    <h2>Secret Widget</h2>
    <span class="price">$99.99</span>
  </div>
  <p id="quoted">He said "it's fine" loudly</p>
</body>
