<!doctype html>
<meta charset="utf-8">
<title>actionable</title>
<style>
  #menu { display: none; }
  #menu.open { display: block; }
  /* The standard upload pattern: the real input is hidden and a custom
     control is shown in its place. */
  input[type=file] { display: none; }
  .cover { position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 999; }
</style>

<button id="open">Insert</button>

<div id="menu">
  <div role="menuitem" tabindex="0">Chart</div>
  <div role="menuitem" tabindex="0">Pivot table</div>
  <button disabled>Macro</button>
  <span>Not a control</span>
  <button aria-label=""></button>
</div>

<label for="upload">Attach a photo</label>
<input id="upload" type="file" multiple>

<input type="file" name="bare_upload">

<p id="plain">Static paragraph</p>

<button id="reveal-overlay">Cover everything</button>
<button id="flash-overlay">Flash a cover</button>
<a id="under" href="#nowhere">Link beneath the overlay</a>

<script>
  document.getElementById('open').addEventListener('click', () => {
    document.getElementById('menu').classList.add('open');
  });
  // A cover that removes itself, the way a component library animates a dialog
  // out. It is genuinely in the way for a moment, and gone shortly after.
  document.getElementById('flash-overlay').addEventListener('click', () => {
    const cover = document.createElement('div');
    cover.className = 'cover';
    cover.id = 'flash';
    document.body.appendChild(cover);
    setTimeout(() => cover.remove(), 400);
  });
  document.getElementById('reveal-overlay').addEventListener('click', () => {
    const cover = document.createElement('div');
    cover.className = 'cover';
    cover.id = 'blocker';
    document.body.appendChild(cover);
  });
</script>

<!-- The real shape from a live admin app: clicking an action opens a modal,
     and the action button is then behind that modal's overlay. Refusing the
     second click is correct; the class list on such an overlay is a Tailwind
     animation salad, so the error has to name the dialog instead. -->
<button id="approve">Approve</button>
<div id="modal" role="dialog" aria-modal="true"
     style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4)">
  <h2>Confirm approval</h2>
  <button id="modal-cancel">Cancel</button>
</div>
<script>
  document.getElementById('approve').addEventListener('click', function () {
    document.getElementById('modal').style.display = 'block';
  });
  document.getElementById('modal-cancel').addEventListener('click', function () {
    document.getElementById('modal').style.display = 'none';
  });
</script>
