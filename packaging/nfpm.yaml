name: aibrowsertoolkit
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
section: utils
priority: optional
maintainer: skssmd <skssmd78475@gmail.com>
description: Agentic browser automation CLI for AI agents
vendor: skssmd
homepage: https://github.com/skssmd/Ai-Browser-Toolkit
license: Apache-2.0

# Chrome is required at runtime but is not in Debian's repositories, and Edge
# counts too. A hard dependency would make this uninstallable; `abt doctor`
# reports what is actually missing.
recommends:
  - google-chrome-stable

contents:
  - src: ./payload/
    dst: /opt/aibrowsertoolkit
  - src: /opt/aibrowsertoolkit/bin/abt
    dst: /usr/bin/abt
    type: symlink
  # The desktop app in the app menu: clicked, not typed.
  - src: ./payload/assets/aibrowsertoolkit.desktop
    dst: /usr/share/applications/aibrowsertoolkit.desktop
  - src: ./payload/assets/logo-white-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/aibrowsertoolkit.png

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove: ./packaging/preremove.sh
